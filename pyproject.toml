[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-quality-gate"
version = "1.3.0"
description = "Compara pruebas de carga (JMeter, k6) contra producción y bloquea el pipeline si la versión nueva es más lenta."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
perf-gate = "perf_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
