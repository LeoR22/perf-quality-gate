# Pipeline que CONSTRUYE la herramienta: tests, verificación del README, integración del consumidor
# y publicación de releases inmutables. El tag mayor (v1) NO se mueve aquí: ver promote.yml.
name: CI - Build & Test

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -v
      - name: El README coincide con los resultados calculados
        if: matrix.python == '3.12'
        run: python scripts/readme_results.py --check

  integracion:
    name: Integración del consumidor
    needs: test
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ github.sha }}

  release:
    name: Publicar release (inmutable)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, integracion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Crear la release; nunca sobrescribir una existente
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::La release $TAG ya existe. Las releases son inmutables: publicar una versión nueva."
            exit 1
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes \
            --notes "Para fijar exactamente esta versión: \`uses: $REPO@$TAG\` (o el SHA del commit). El alias \`${TAG%%.*}\` se actualiza aparte, con el workflow *Promover tag mayor*."
