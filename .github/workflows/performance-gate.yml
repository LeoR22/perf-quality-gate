# Gate automático de las versiones A y B con la action de este mismo commit (./), en cada push y PR.
# Resultado esperado: version-a en ROJO (no pasa: el gate bloquea) y version-b en VERDE (pasa).
# El rojo de A es el comportamiento correcto que pide el reto: la versión no puede reemplazar a producción.
name: Performance Gate - Versiones A y B

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a evaluar"
        type: choice
        options: [todas, version-a, version-b]
        default: todas

permissions:
  contents: read

jobs:
  gate:
    name: Gate ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # que una versión en rojo no cancele la otra
      matrix:
        version: ${{ fromJSON((inputs.version == '' || inputs.version == 'todas') && '["version-a","version-b"]' || format('["{0}"]', inputs.version)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Performance Quality Gate
        id: gate
        uses: ./                 # en otro repo: LeoR22/perf-quality-gate@v1
        with:
          baseline: examples/resultados/produccion-actual.csv
          candidate: examples/resultados/${{ matrix.version }}.csv
          config: perf-gate.yml
          name: ${{ matrix.version }}

      - name: Veredicto
        if: always()
        run: echo "${{ matrix.version }} → ${{ steps.gate.outputs.result }}"
